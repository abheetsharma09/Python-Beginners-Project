<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a6fd6;
        }

        .result-card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .placed {
            background-color: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .not-placed {
            background-color: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Placement Predictor</h2>
        
        <form id="predictForm">
            <div class="form-group">
                <label for="cgpa">CGPA</label>
                <input type="number" step="0.1" min="0" max="10" name="cgpa" id="cgpa" required placeholder="e.g. 9.9">
            </div>
            
            <div class="form-group">
                <label for="iq">IQ</label>
                <input type="number" name="iq" id="iq" required placeholder="e.g. 120">
            </div>
            
            <button type="submit">Predict Placement</button>
        </form>

        <div id="resultCard" class="result-card"></div>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const cgpa = parseFloat(document.getElementById('cgpa').value);
            const iq = parseInt(document.getElementById('iq').value);
            const resultCard = document.getElementById('resultCard');

            // Format exactly matching your expected backend input structure
            const payload = {
                cgpa: cgpa,
                iq: iq
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('Server response error');
                }

                const data = await response.json();
                
                // Read exactly from your structure: {"output": 1}
                const prediction = data.output;

                resultCard.style.display = 'block';
                
                if (parseInt(prediction) === 1) {
                    resultCard.className = 'result-card placed';
                    resultCard.innerText = '🎉 Congratulations! You are Placed.';
                } else {
                    resultCard.className = 'result-card not-placed';
                    resultCard.innerText = '❌ Sorry! No Placement.';
                }

            } catch (error) {
                console.error('Error:', error);
                resultCard.style.display = 'block';
                resultCard.className = 'result-card not-placed';
                resultCard.innerText = '⚠️ Error fetching prediction.';
            }
        });
    </script>
</body>
</html>
